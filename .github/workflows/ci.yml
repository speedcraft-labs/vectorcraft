name: Hosted CI
on:
  push:
    branches: [main, algo/ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libdbus-1-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev fonts-noto-cjk fonts-unifont
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      # Linux fallback shaping varies across system font databases (https://github.com/speedcraft-labs/hyper/issues/258).
      - name: Known Linux font fallback test
        continue-on-error: true
        run: cargo test -p vectorcraft-engine --lib tests::textedit::the_fallback_glyph_of_a_consonant_after_its_vowel_sign_is_reported -- --exact
      - name: Workspace tests
        run: cargo test --workspace --no-fail-fast -- --skip tests::textedit::the_fallback_glyph_of_a_consonant_after_its_vowel_sign_is_reported
